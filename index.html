  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Réplica estática del formulario de contacto (ver src/components/b2b/LeadForm.jsx).
      Netlify detecta formularios escaneando el HTML generado en el build, no el JSX que
      arma React en el navegador. Sin esto, el form real no queda registrado y los envíos
      se pierden. Los "name" de acá tienen que ser EXACTAMENTE los mismos que en LeadForm.jsx.
    -->
    <form name="contacto-clubes" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="club" />
      <input type="text" name="courts" />
      <input type="text" name="phone" />
      <input type="text" name="interest" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
